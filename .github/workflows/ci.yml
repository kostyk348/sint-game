name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust core (sintgame)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (golden против Python-прототипа)
        run: cargo test

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests (offline, no LLM/network)
        run: python -m pytest -q
      - name: Validate examples
        run: |
          python -m sintgame validate examples/lighthouse/world.json
          python -m sintgame validate examples/station/world.json
