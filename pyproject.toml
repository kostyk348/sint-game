[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sint-game"
version = "0.1.0"
description = "Детерминированный движок текстовых LLM-игр: LLM компилирует мир, ядро исполняет, ворота решают."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "sint-game authors" }]
keywords = ["game-engine", "llm", "rpg", "deterministic", "procedural-generation", "ai-games"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
sintgame = "sintgame.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["sintgame"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
